name: Generate pacman animation

on:
  schedule: # executa a cada 12 horas
    - cron: "0 */12 * * *" # Corrigido para ser um cron válido

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Aumentado para acomodar a espera de 10 min

    steps:
      # --- Primeira Tentativa ---
      - name: Generate pacman animation (Attempt 1)
        id: generate_attempt_1 # ID para referenciar o resultado deste passo
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        continue-on-error: true # Permite que o workflow continue mesmo se este passo falhar

      # --- Lógica de Nova Tentativa ---
      - name: Wait 10 minutes and retry if first attempt failed
        if: steps.generate_attempt_1.outcome == 'failure' # Executa apenas se o passo anterior falhou
        run: |
          echo "⚠️ A primeira tentativa falhou. Aguardando 10 minutos para tentar novamente..."
          sleep 600 # 600 segundos = 10 minutos

      # --- Segunda Tentativa ---
      - name: Generate pacman animation (Attempt 2)
        if: steps.generate_attempt_1.outcome == 'failure' # Executa apenas se o passo original falhou
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        # Se este passo falhar, o job inteiro falhará, o que é o comportamento esperado.

      # --- Envio do Arquivo ---
      - name: Push pacman-contribution-graph.svg to the output branch
        # Este passo só será executado se o job estiver com status de sucesso até aqui.
        # Ou seja, se a primeira ou a segunda tentativa funcionou.
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
